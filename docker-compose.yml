services:
  postgres:
    image: postgres:16-alpine
    container_name: neithal-hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-neithal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-neithal_secure_hrms_pass_2026}
      POSTGRES_DB: ${DB_NAME:-neithal_hrms}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-neithal} -d ${DB_NAME:-neithal_hrms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neithal-hrms-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neithal-hrms-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-neithal}
      DB_PASSWORD: ${DB_PASSWORD:-neithal_secure_hrms_pass_2026}
      DB_NAME: ${DB_NAME:-neithal_hrms}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_hrms_jwt_token_key_64_characters_long_string_adappt_2026}
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
